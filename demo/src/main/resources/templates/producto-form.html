<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<nav class="navbar">
    <h1><i class="fas fa-car"></i> Sistema de Ventas</h1>
    <div class="user-info">
        <span><i class="fas fa-user-circle"></i> <span th:text="${session.usuarioLogueado}"></span></span>
        <a href="/logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
    </div>
</nav>

<div class="container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header">
            <h2 th:text="${titulo}"></h2>
        </div>

        <div th:if="${param.error}" class="error-message" th:text="${param.error}"></div>

        <form th:action="${producto.codigoProducto == null ? '/producto/guardar' : '/producto/actualizar/' + producto.codigoProducto}" method="post">
            <div th:if="${producto.codigoProducto != null}">
                <input type="hidden" name="codigoProducto" th:value="${producto.codigoProducto}">
            </div>

            <div class="form-group">
                <label>Nombre del Producto:</label>
                <input type="text" name="nombreProducto" th:value="${producto.nombreProducto}" required>
            </div>

            <div class="form-group">
                <label>Precio:</label>
                <input type="number" step="0.01" name="precio" th:value="${producto.precio}" required>
            </div>

            <div class="form-group">
                <label>Stock:</label>
                <input type="number" name="stock" th:value="${producto.stock}" required>
            </div>

            <div class="form-group">
                <label>Estado:</label>
                <select name="estado">
                    <option value="1" th:selected="${producto.estado == 1}">Activo</option>
                    <option value="0" th:selected="${producto.estado == 0}">Inactivo</option>
                </select>
            </div>

            <div class="modal-buttons" style="margin-top: 20px;">
                <button type="submit" class="btn-save">Guardar</button>
                <a href="/home" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
