<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<nav class="navbar">
    <h1><i class="fas fa-car"></i> Sistema de Ventas</h1>
    <div class="user-info">
        <span><i class="fas fa-user-circle"></i> <span th:text="${session.usuarioLogueado}"></span></span>
        <a href="/logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
    </div>
</nav>

<div class="container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header">
            <h2 th:text="${titulo}"></h2>
        </div>

        <div th:if="${param.error}" class="error-message" th:text="${param.error}"></div>

        <form th:action="${detalle.codigoDetalleVenta == null ? '/detalle/guardar' : '/detalle/actualizar/' + detalle.codigoDetalleVenta}" method="post">
            <div class="form-group">
                <label>Cantidad:</label>
                <input type="number" name="cantidad" th:value="${detalle.cantidad}" required>
            </div>

            <div class="form-group">
                <label>Precio Unitario:</label>
                <input type="number" step="0.01" name="precioUnitario" th:value="${detalle.precioUnitario}" required>
            </div>

            <div class="form-group">
                <label>Subtotal:</label>
                <input type="number" step="0.01" name="subtotal" th:value="${detalle.subtotal}" required>
            </div>

            <div class="form-group">
                <label>Producto:</label>
                <select name="productoCodigo" required>
                    <option value="">Seleccione un producto</option>
                    <option th:each="producto : ${productos}"
                            th:value="${producto.codigoProducto}"
                            th:text="${producto.codigoProducto + ' - ' + producto.nombreProducto + ' (Q.' + producto.precio + ')'}"
                            th:selected="${detalle.producto != null and detalle.producto.codigoProducto == producto.codigoProducto}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Venta (ID):</label>
                <select name="ventaCodigo" required>
                    <option value="">Seleccione una venta</option>
                    <option th:each="venta : ${ventas}"
                            th:value="${venta.codigoVenta}"
                            th:text="${venta.codigoVenta + ' - Fecha: ' + venta.fechaVenta + ' - Total: Q.' + venta.total}"
                            th:selected="${detalle.venta != null and detalle.venta.codigoVenta == venta.codigoVenta}">
                    </option>
                </select>
            </div>

            <div class="modal-buttons" style="margin-top: 20px;">
                <button type="submit" class="btn-save">Guardar</button>
                <a href="/home" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
