<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Ventas</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/usuario.css}">
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>Sistema de Ventas</h1>
        <p>Ingrese sus credenciales para acceder</p>
    </div>

    <div th:if="${error}" class="error-message" th:text="${error}"></div>
    <div th:if="${registroExito}" class="success-message" th:text="${registroExito}"></div>

    <form action="/login" method="post">
        <div class="form-group">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" required placeholder="Ingrese su usuario">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required placeholder="Ingrese su contraseña">
        </div>

        <button type="submit" class="btn-login">Iniciar Sesión</button>
    </form>

    <div class="register-link">
        <p>¿No tienes cuenta? <a href="/registro">Regístrate aquí</a></p>
    </div>
</div>
</body>
</html>
