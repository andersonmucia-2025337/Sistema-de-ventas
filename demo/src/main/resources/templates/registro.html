<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Ventas</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/registro.css}">
</head>
<body>
<div class="register-container">
    <div class="register-header">
        <h1>Crear Cuenta</h1>
        <p>Regístrese para acceder al sistema</p>
    </div>

    <div th:if="${error}" class="error-message" th:text="${error}"></div>
    <div th:if="${exito}" class="success-message" th:text="${exito}"></div>

    <form action="/registro" method="post">
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required placeholder="Ingrese su usuario">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required placeholder="Ingrese su contraseña">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="Ingrese su email">
        </div>

        <div class="form-group">
            <label for="rol">Rol</label>
            <select id="rol" name="rol" required>
                <option value="vendedor">Vendedor</option>
                <option value="cajero">Cajero</option>
                <option value="administrador">Administrador</option>
            </select>
        </div>

        <button type="submit" class="btn-register">Registrarse</button>
    </form>

    <div class="login-link">
        <p>¿Ya tienes cuenta? <a href="/usuario">Iniciar Sesión</a></p>
    </div>
</div>
</body>
</html>
