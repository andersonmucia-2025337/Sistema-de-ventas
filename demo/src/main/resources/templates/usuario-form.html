<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<nav class="navbar">
    <h1><i class="fas fa-car"></i> Sistema de Ventas</h1>
    <div class="user-info">
        <span><i class="fas fa-user-circle"></i> <span th:text="${session.usuarioLogueado}"></span></span>
        <a href="/logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
    </div>
</nav>

<div class="container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header">
            <h2 th:text="${titulo}"></h2>
        </div>

        <div th:if="${param.error}" class="error-message" th:text="${param.error}"></div>

        <form th:action="${usuario.codigoUsuario == null ? '/usuario/guardar' : '/usuario/actualizar/' + usuario.codigoUsuario}" method="post">
            <div class="form-group">
                <label>Usuario:</label>
                <input type="text" name="username" th:value="${usuario.username}" required>
            </div>

            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" name="password" th:required="${usuario.codigoUsuario == null}">
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" th:value="${usuario.email}" required>
            </div>

            <div class="form-group">
                <label>Rol:</label>
                <select name="rol" required>
                    <option value="vendedor" th:selected="${usuario.rol == 'vendedor'}">Vendedor</option>
                    <option value="cajero" th:selected="${usuario.rol == 'cajero'}">Cajero</option>
                    <option value="administrador" th:selected="${usuario.rol == 'administrador'}">Administrador</option>
                </select>
            </div>

            <div class="form-group">
                <label>Estado:</label>
                <select name="estado">
                    <option value="1" th:selected="${usuario.estado == 1}">Activo</option>
                    <option value="0" th:selected="${usuario.estado == 0}">Inactivo</option>
                </select>
            </div>

            <div class="modal-buttons" style="margin-top: 20px;">
                <button type="submit" class="btn-save">Guardar</button>
                <a href="/home" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
